name: Build Android & iOS Mobile Apps (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (dist/)
        run: npm run build

      - name: Add or Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Build Android Release Bundle (AAB)
        working-directory: ./android
        run: ./gradlew bundleRelease

      - name: Upload Android Debug APK Artifact (Ready to Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: PrismGrid-3D-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Release AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: PrismGrid-3D-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS App Archive (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (dist/)
        run: npm run build

      - name: Add or Sync Capacitor iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build iOS Simulator & Unsigned Device App via Xcodebuild
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r PrismGrid-3D-iOS-Unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismGrid-3D-iOS-Unsigned-IPA
          path: ios/App/PrismGrid-3D-iOS-Unsigned.ipa
